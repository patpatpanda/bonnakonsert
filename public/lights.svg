<svg width="100%" height="140" viewBox="0 0 1500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Kabel -->
  <path d="M0 60 Q300 120 600 60 T1500 60" stroke="#4b3120" stroke-width="8" fill="none" stroke-linecap="round"></path>

  <!-- Lampor -->
  <g>
    <circle cx="120" cy="105" r="18" class="bulb b1"></circle>
    <circle cx="290" cy="135" r="18" class="bulb b2"></circle>
    <circle cx="460" cy="115" r="18" class="bulb b3"></circle>
    <circle cx="630" cy="145" r="18" class="bulb b4"></circle>
    <circle cx="800" cy="115" r="18" class="bulb b5"></circle>
    <circle cx="970" cy="135" r="18" class="bulb b6"></circle>
    <circle cx="1140" cy="120" r="18" class="bulb b7"></circle>
    <circle cx="1310" cy="135" r="18" class="bulb b8"></circle>
  </g>

  <style>
    .bulb {
      fill: #f8d37d;
      filter: drop-shadow(0 0 4px #f8d37d);
    }

    @keyframes glow1 { 0%,100% { opacity: .9; filter: drop-shadow(0 0 5px #ffd98a);} 50% { opacity: 1; filter: drop-shadow(0 0 14px #ffe7ad);} }
    @keyframes glow2 { 0%,100% { opacity: .85; filter: drop-shadow(0 0 4px #ffd98a);} 50% { opacity: .95; filter: drop-shadow(0 0 10px #ffe7ad);} }
    @keyframes glow3 { 0%,100% { opacity: .9; filter: drop-shadow(0 0 5px #ffd98a);} 50% { opacity: .7; filter: drop-shadow(0 0 7px #ffe7ad);} }

    .b1 { animation: glow1 2.4s infinite ease-in-out; }
    .b2 { animation: glow2 3s infinite ease-in-out; }
    .b3 { animation: glow3 2.2s infinite ease-in-out; }
    .b4 { animation: glow1 3.4s infinite ease-in-out; }
    .b5 { animation: glow2 2.3s infinite ease-in-out; }
    .b6 { animation: glow3 3.1s infinite ease-in-out; }
    .b7 { animation: glow1 2.7s infinite ease-in-out; }
    .b8 { animation: glow2 3.3s infinite ease-in-out; }
  </style>
</svg>
